name: CI

on:
  push:
    branches: [ master, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    name: Tests (Linux, Win32 shim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show compiler
        run: g++ --version

      - name: Build and run test suites
        working-directory: Tests/linux
        run: make check

      # The shim compiles the Win32 sources under GCC's warning set, which is
      # stricter than the project's /W3 in places. Informational only: the
      # existing sources have pre-existing warnings, so this does not gate.
      - name: Warning report (informational)
        if: always()
        working-directory: Tests/linux
        continue-on-error: true
        run: |
          g++ -fsyntax-only -std=c++17 -Wall -Wextra \
              -Wno-unknown-pragmas -Wno-reorder -Wno-unused-parameter \
              -Iwin32shim -I../../Grid32 \
              ../../Grid32/Grid32Mgr.cpp ../../Grid32/Formulator.cpp 2>&1 | tee warnings.txt
          echo "warning count: $(grep -c 'warning:' warnings.txt || true)"

  windows-build:
    name: Build + tests (Windows, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # Grid32 is a plain Win32 DLL with no MFC dependency. Both platforms
      # are built: several of the open audit items are size_t/LONG truncations
      # that only bite on one of them.
      - name: Build Grid32 (x64 Release)
        run: msbuild Grid32\Grid32.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Build Grid32 (Win32 Release)
        run: msbuild Grid32\Grid32.vcxproj /p:Configuration=Release /p:Platform=Win32 /m /v:minimal

      # The same two suites the Linux job runs, here compiled by cl.exe rather
      # than GCC. GridMgrTests is Linux-only: it defines Win32 symbols that
      # would collide with the real ones.
      - name: Grid32 helper tests
        shell: cmd
        run: Tests\run_tests.bat

      - name: Formulator tests
        shell: cmd
        run: Tests\run_formulator_tests.bat

      # NOT BUILT HERE: Spreadsheet.vcxproj, the MFC host.
      #
      # It sets UseOfMfc=Dynamic with PlatformToolset=v143, and the
      # windows-latest image ships no MFC for that toolset, so msbuild fails
      # with MSB8041. Adding the generic ATL/MFC component
      # (Microsoft.VisualStudio.Component.VC.ATLMFC) was measured at 227s per
      # run and does not fix it — it installs MFC for the image's newest
      # toolset (v170), not for v143, so MSB8041 still fires.
      #
      # Making it build would mean pinning the version-specific component for
      # whichever v143 toolset the image carries, and paying ~4 minutes on
      # every run. If that trade is worth it later, add a step before the
      # build that runs vs_installer with
      #   --add Microsoft.VisualStudio.Component.VC.<version>.MFC
      # and then `msbuild Spreadsheet.sln`. Until then the MFC host is
      # compiled only on developer machines.
