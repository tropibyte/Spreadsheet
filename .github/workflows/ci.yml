name: CI

on:
  push:
    branches: [ master, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    name: Tests (Linux, Win32 shim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show compiler
        run: g++ --version

      - name: Build and run test suites
        working-directory: Tests/linux
        run: make check

      # The shim compiles the Win32 sources under GCC's warning set, which is
      # stricter than the project's /W3 in places. Informational only: the
      # existing sources have pre-existing warnings, so this does not gate.
      - name: Warning report (informational)
        if: always()
        working-directory: Tests/linux
        continue-on-error: true
        run: |
          g++ -fsyntax-only -std=c++17 -Wall -Wextra \
              -Wno-unknown-pragmas -Wno-reorder -Wno-unused-parameter \
              -Iwin32shim -I../../Grid32 \
              ../../Grid32/Grid32Mgr.cpp ../../Grid32/Formulator.cpp 2>&1 | tee warnings.txt
          echo "warning count: $(grep -c 'warning:' warnings.txt || true)"

  windows-build:
    name: Build + tests (Windows, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # Grid32 is a plain Win32 DLL with no MFC dependency, so this is the
      # part of the build that must always work.
      - name: Build Grid32 (x64 Release)
        run: msbuild Grid32\Grid32.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      # The runner image ships no MFC (MSB8041), and Spreadsheet.vcxproj sets
      # UseOfMfc=Dynamic, so the component has to be added before it will build.
      - name: Install ATL/MFC
        shell: pwsh
        run: |
          $vswhere   = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vs = & $vswhere -latest -property installationPath
          Write-Host "Visual Studio: $vs"
          $t0 = Get-Date
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$vs`"",
              '--add', 'Microsoft.VisualStudio.Component.VC.ATLMFC',
              '--quiet', '--norestart', '--nocache')
          Write-Host "vs_installer exit $($p.ExitCode) after $([int]((Get-Date)-$t0).TotalSeconds)s"
          # 3010 = success, reboot requested. Anything else is a real failure.
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - name: Build solution (x64 Release)
        run: msbuild Spreadsheet.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      # The same two suites the Linux job runs, here under MSVC. GridMgrTests
      # is Linux-only: it defines Win32 symbols that collide with the real ones.
      - name: Grid32 helper tests
        shell: cmd
        run: Tests\run_tests.bat

      - name: Formulator tests
        shell: cmd
        run: Tests\run_formulator_tests.bat
